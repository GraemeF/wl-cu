[package]
name = "wl-cu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Compositor-portable computer-use CLI for Wayland"
repository = "https://github.com/thrawny/wl-cu"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
memmap2 = "0.9.10"
niri-ipc = "26.4.0"
rustix = { version = "1.1.4", default-features = false, features = ["event", "fs", "mm", "process", "shm", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wayland-client = "0.31.14"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
